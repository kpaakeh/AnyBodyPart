plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('verifyBodyStates', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.kpkh.anybodyparts.BodyStateTest'
    enableAssertions = true
}

check.dependsOn verifyBodyStates

test { failOnNoDiscoveredTests = false }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'anybodyparts-test'
    enableGameTests = false
    enableClientGameTests = true
    eula = false
}

tasks.withType(Jar).configureEach { from('LICENSE') }
